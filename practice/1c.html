<!DOCTYPE html>
<html>
    <head>
        <title>
            twitter services
        </title>
        <style>
            .cat_img{
                width:50px;
                height:50px;
                object-fit:cover;
                border-radius:50%;
                vertical-align:middle;
            }
            .sbox{
                vertical-align:middle;
                border:none;
                border-radius:35px;
                padding-right:40px;
                font-size:1.1em;
            }
            .sbox:hover{
                box-shadow:5px 5px 5px rgba(0,0,0,0.15);
                
            }
            .tweet{
                color:white;
                background-color:rgb(31, 143, 213);
                font-weight:solid;
                font-size:1.1em;
                border-radius:30px;
                border:none;
                padding-right:20px;
                padding-left:20px;
                padding-top:05px;
                padding-bottom:5px;}
                .tweet:hover{
                    cursor:pointer;
                    box-shadow:5px 5px 5px rgba(0,0,0,0.15);
                    opacity:0.9;
                }
        </style>

    </head>
    <body>
        <img  class="cat_img" src="https://i.pinimg.com/564x/7d/44/d5/7d44d55ead7dda48bd95632d92fb259d.jpg" >
        <input placeholder="What's happening?" type="text" class="sbox">
       <button class="tweet" >
        Tweet
       </button>
    
</html>
